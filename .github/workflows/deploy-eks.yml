name: Deploy to EKS v2

on:
  push:
    branches:
      - deploy2

env:
  AWS_REGION: ap-northeast-2
  ECR_REPOSITORY: kube-cardinal        # ECR 리포지토리 이름
  EKS_CLUSTER_NAME: kube-cardinal-2025       # EKS 클러스터 이름
  K8S_DEPLOYMENT_NAME: spring-deployment
  K8S_SECRET_NAME: cardinal-secret
  K8S_MANIFEST_PATH: kube-manifests/

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Build JAR
        run: |
          chmod +x gradlew
          ./gradlew clean build -x test

      # 4. AWS 자격 증명
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          role-to-assume: ${{ secrets.AWS_IAM_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # 5. ECR 로그인
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v1

      # 6. Docker 이미지 빌드-ECR Push
      - name: Build, tag, and push image to Amazon ECR
        id: build-image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          echo "image=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> $GITHUB_OUTPUT


      - name: Set up Kubeconfig for EKS
        run: aws eks update-kubeconfig --name ${{ env.EKS_CLUSTER_NAME }} --region ${{ env.AWS_REGION }}

      # Service Manifest에 인증서 ARN 값 주입
      - name: Substitute ARN in Service Manifest
        run: |
          sed -i 's|CERTIFICATE_ARN_PLACEHOLDER|${{ secrets.AWS_CERTIFICATE_ARN }}|g' ${{ env.K8S_MANIFEST_PATH }}/service.yaml

      #  Manifest 배포
      - name: Deploy other manifests to EKS
        run: kubectl apply -f ${{ env.K8S_MANIFEST_PATH }}

      # Deployment에 새 이미지 롤링 업데이트
      - name: Trigger rolling update
        run: kubectl set image deployment/${{ env.K8S_DEPLOYMENT_NAME }} spring-container=${{ steps.build-image.outputs.image }}
