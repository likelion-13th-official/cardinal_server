apiVersion: apps/v1
kind: Deployment

metadata:
  name: redis-deployment

spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
        - name: redis-container
          image: redis:7-alpine
          ports:
            - containerPort: 6379
          command: [ "redis-server" ]
          args: [ "--requirepass", "$(REDIS_PASSWORD)" ]
          env:
              - name: REDIS_PASSWORD
                valueFrom:
                  secretKeyRef:
                    name: cardinal-secret
                    key: redis-password
---
apiVersion: v1
kind: Service
metadata:
  name: redis-service
spec:
  selector:
    app: redis
  ports:
    - protocol: TCP
      port: 6379
      targetPort: 6379
  type: ClusterIP