spring:
  application:
    name: cardinal
  config:
      import: optional:file:.env[.properties]
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  sql:
    init:
      mode: never
  jpa:
    open-in-view: false
    database: postgresql
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        transaction.jta.platform: org.hibernate.service.jta.JtaPlatform
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
    show-sql: true  # 콘솔에 SQL 로그 출력

  security:
    oauth2:
      client:
        registration:
          kakao:
            client-id: 32ec0d25b834c5a288359a0a5943fd00
            client-name: Kakao
            redirect-uri: "http://localhost:8080/login/oauth2/code/kakao"
            authorization-grant-type: authorization_code
            client-authentication-method:  none
            scope:
              - profile_nickname
              - profile_image
          google:
            client-id: 691786440190-club628ig10fs515q1r4fm42j4rb7etv.apps.googleusercontent.com
            client-secret: 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
            redirect-uri: http://localhost:8080/login/oauth2/code/google
            scope:
              - profile
              - email
        provider:
          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            user-name-attribute: id
          google:
            authorization-uri: https://accounts.google.com/o/oauth2/v2/auth
            token-uri: https://oauth2.googleapis.com/token
            user-info-uri: https://www.googleapis.com/oauth2/v3/userinfo
            user-name-attribute: sub
jwt:
  secret: "${JWT_SECRET}"
  access-token-validity-seconds: 900
  refresh-token-validity-seconds: 1209600

logging:
  level:
    org.springframework.security: TRACE
    org.springframework.web.client: DEBUG
