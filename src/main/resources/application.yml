server:
  forward-headers-strategy: framework
  servlet:
    session:
      cookie:
        secure: true

spring:
  application:
    name: cardinal
  config:
      import: optional:file:.env[.properties]
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  sql:
    init:
      mode: never

  jpa:
    database: postgresql
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        transaction.jta.platform: org.hibernate.service.jta.JtaPlatform
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
    show-sql: true  # 콘솔에 SQL 로그 출력

  security:
    oauth2:
      client:
        registration:
          kakao:
            client-id: ${REST_API_KEY}
            client-authentication-method: none   # ← Secret 미사용일 때
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            scope:
              - profile_nickname
              - profile_image
            provider: kakao
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            scope: openid, profile, email
            provider : Google
        provider:
          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            user-name-attribute: id
jwt:
  secret: "${JWT_SECRET}"
  access-token-validity-seconds: ${ACCESS_SEC}
  refresh-token-validity-seconds: ${REFRESH_SEC}

app:
  oauth2:
    allowed-redirect-uris:
      - http://localhost:5173/mypage/callback     # 개발용 SPA 콜백
      - https://sogang-cardinal.vercel.app/mypage/callback  # 배포용 SPA 콜백
    default-redirect-uri: https://sogang-cardinal.vercel.app/mypage/callback
  one-time-code:
    ttl-seconds:  ${ONE_TIME_CODE}                              # 원타임 코드 유효기간(초)

logging:
  level:
    org.springframework.security: DEBUG
    org.springframework.security.oauth2: DEBUG
    org.springframework.web.client.RestTemplate: DEBUG

cloud:
  aws:
    s3:
      bucket: cardinal2025.bucket
    region:
      static: ap-northeast-2
      auto: false
    stack:
      auto: false
    credentials:
      access-key: ${S3_ACCESS_KEY}
      secret-key: ${S3_SECRET_KEY}
