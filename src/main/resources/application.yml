spring:
  application:
    name: cardinal
  config:
      import: optional:file:.env[.properties]
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  sql:
    init:
      mode: always
  jpa:
    database: postgresql
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        transaction.jta.platform: org.hibernate.service.jta.JtaPlatform
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
    show-sql: true  # 콘솔에 SQL 로그 출력

  security:
    oauth2:
      client:
        registration:
          kakao:
            client-id: 32ec0d25b834c5a288359a0a5943fd00
            client-secret: ${CLIENT_SECRET}   # 사용X
            client-name: Kakao
            redirect-uri: ${KAKAO_URI}         #
            authorization-grant-type: authorization_code
            client-authentication-method: client_secret_post
            scope:
              - profile_nickname
              - profile_image
        provider:
          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            user-name-attribute: id
jwt:
  secret: "${JWT_SECRET}"
  access-token-validity-seconds: 900
  refresh-token-validity-seconds: 1209600

logging:
  level:
    org.springframework.security: DEBUG
